<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새 탭 - 시작 페이지</title>
  <meta name="description" content="서울·제주 날씨, 구글 검색, 오늘의 명언이 담긴 시작 홈페이지" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Product+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 배경 파티클 캔버스 -->
  <canvas id="bgCanvas"></canvas>

  <!-- ── 상단 헤더 바 ── -->
  <header class="top-bar">
    <!-- 좌측: SDU 로고 -->
    <a class="sdu-logo" href="https://www.sdu.ac.kr" target="_blank" rel="noopener" title="서울디지털대학교 홈페이지">
      <span class="sdu-badge">SDU</span>
      <span class="sdu-name">서울디지털대학교</span>
    </a>

    <!-- 우측: 날씨 -->
    <div class="header-weather">
      <div class="hw-card" id="weatherSeoul">
        <div class="weather-loading">
          <div class="spinner"></div>
          <span>서울 날씨...</span>
        </div>
      </div>
      <div class="hw-card" id="weatherJeju">
        <div class="weather-loading">
          <div class="spinner"></div>
          <span>제주 날씨...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── 메인 컨테이너 ── -->
  <main class="main-container">

    <!-- 검색창 -->
    <div class="search-section">
      <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
        <div class="search-box" id="searchBox">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 21L15.803 15.803M15.803 15.803A7.5 7.5 0 1 0 5.197 5.197a7.5 7.5 0 0 0 10.606 10.606Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            type="text"
            name="q"
            id="searchInput"
            class="search-input"
            placeholder="Google 검색"
            autocomplete="off"
            aria-label="검색어 입력"
          />
          <button type="button" class="mic-btn" id="micBtn" aria-label="음성 검색" title="음성으로 검색">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
        </div>
        <div class="search-suggestions" id="searchSuggestions"></div>
        <div class="search-buttons">
          <button type="submit" class="search-btn" id="googleSearchBtn">Google 검색</button>
          <button type="button" class="search-btn lucky-btn" id="luckyBtn">I'm Feeling Lucky</button>
        </div>
      </form>
    </div>

  </main>

  <!-- ── 하단 명언 바 ── -->
  <footer class="quote-bar">
    <div class="quote-bar-inner">
      <span class="qb-open">"</span>
      <blockquote class="qb-text" id="quoteText"></blockquote>
      <cite class="qb-author" id="quoteAuthor"></cite>
      <span class="qb-close">"</span>
      <button class="qb-refresh" id="quoteRefresh" aria-label="다음 명언" title="다른 명언">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
